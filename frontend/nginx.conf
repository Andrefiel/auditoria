server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versão do Nginx no cabeçalho Server
    server_tokens off;

    # Limite máximo de payload para requisições
    client_max_body_size 10M;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API — proxy reverso pro container do backend (rede interna do compose)
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA — qualquer rota que não seja /api cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

