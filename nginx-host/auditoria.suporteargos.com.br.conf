# /etc/nginx/sites-available/auditoria.suporteargos.com.br
#
# Este arquivo roda no nginx do PRÓPRIO SERVIDOR (não em container).
# Ele só repassa o tráfego pra porta 17430, onde o container "frontend"
# está escutando (que por sua vez já faz o proxy interno de /api pro
# backend). Ou seja: nginx do host → container frontend (nginx) → container backend.
#
# Instalação:
#   sudo cp nginx-host/auditoria.suporteargos.com.br.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/auditoria.suporteargos.com.br /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Pra HTTPS (com Certbot):
#   sudo certbot --nginx -d auditoria.suporteargos.com.br

server {
    listen 80;
    listen [::]:80;
    server_name auditoria.suporteargos.com.br;

    # Ocultar versão do Nginx
    server_tokens off;

    # Limite máximo de envio de arquivos/payload
    client_max_body_size 15m;

    # Cabeçalhos Globais de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:17430;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout estendido para geração de PDFs grandes
        proxy_read_timeout 90s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/auditoria.access.log;
    error_log  /var/log/nginx/auditoria.error.log warn;
}

