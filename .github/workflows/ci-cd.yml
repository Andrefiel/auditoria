name: CI/CD Pipeline - Portal de Atas SGQ

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/web

jobs:
  # ========================================================
  # ETAPA 1: Validação de Código, Tipos TypeScript e Linter
  # ========================================================
  validate-and-typecheck:
    name: 🔍 TypeScript, Prisma & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Instalar Dependências
        working-directory: ./web
        run: npm install

      - name: Gerar Prisma Client
        working-directory: ./web
        run: npx prisma generate

      - name: Validação Estrita de Tipos (TypeScript)
        working-directory: ./web
        run: npx tsc --noEmit

      - name: Verificação de Qualidade (ESLint)
        working-directory: ./web
        run: npm run lint

  # ========================================================
  # ETAPA 2: Validação e Build do Docker Compose
  # ========================================================
  docker-compose-build:
    name: 🐳 Docker Build & Compose Check
    runs-on: ubuntu-latest
    needs: validate-and-typecheck

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Validar Sintaxe do Docker Compose
        run: docker compose config

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem da Aplicação Web
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # ETAPA 3: Publicação da Imagem no GitHub Packages (CD)
  # (Executado apenas em merges/push na branch principal)
  # ========================================================
  publish-container-image:
    name: 📦 Publicar Imagem (GHCR)
    runs-on: ubuntu-latest
    needs: [validate-and-typecheck, docker-compose-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair Metadados da Imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Publicar Imagem de Produção
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # ETAPA 4: Deploy Automático no Servidor (Opcional via SSH)
  # ========================================================
  # Para ativar o deploy automático no seu servidor Linux/Windows:
  # Configure os segredos no GitHub (Settings -> Secrets):
  # - SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
