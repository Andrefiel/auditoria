name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite disparar manualmente pela aba Actions

concurrency:
  group: deploy-auditoria-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Escrever .env a partir dos secrets do repositório
        run: |
          cat > .env << EOF
          POSTGRES_DB=${{ vars.POSTGRES_DB || 'auditoria' }}
          POSTGRES_USER=${{ vars.POSTGRES_USER || 'auditoria_app' }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'auditoria_argos_db_pass' }}

          BACKEND_PORT=4000
          JWT_SECRET=${{ secrets.JWT_SECRET || 'auditoria_argos_jwt_super_secret_key_2026' }}
          APP_URL=${{ vars.APP_URL || 'http://192.168.0.112:17430' }}

          # ---------- LDAP / Active Directory ----------
          LDAP_SERVER=${{ vars.LDAP_SERVER || secrets.LDAP_SERVER || '192.168.0.4' }}
          LDAP_PORT=${{ vars.LDAP_PORT || '389' }}
          LDAP_USE_SSL=false
          LDAP_BASE_DN=${{ vars.LDAP_BASE_DN || 'DC=argos,DC=local' }}
          LDAP_BIND_DN=${{ secrets.LDAP_BIND_DN }}
          LDAP_BIND_PASSWORD=${{ secrets.LDAP_BIND_PASSWORD }}
          LDAP_USERS_OU=${{ vars.LDAP_USERS_OU || 'OU=Usuarios,DC=argos,DC=local' }}
          LDAP_ADMIN_GROUP=${{ vars.LDAP_ADMIN_GROUP || 'Qualidade' }}
          LDAP_UPN_SUFFIX=${{ vars.LDAP_UPN_SUFFIX || 'argos.local' }}

          # ---------- SMTP ----------
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ vars.SMTP_FROM || 'Auditoria Interna Argos <auditoria@argospatologia.com.br>' }}
          LIDERES_NOTIFY_EMAIL=${{ vars.LIDERES_NOTIFY_EMAIL }}
          EOF

      - name: Build e subida dos containers
        run: docker compose up -d --build --remove-orphans

      - name: Aguardar backend responder
        run: |
          for i in $(seq 1 20); do
            if docker compose exec -T backend wget -qO- http://localhost:4000/health; then
              echo "Backend no ar."
              exit 0
            fi
            echo "Aguardando backend... ($i/20)"
            sleep 3
          done
          echo "Backend não respondeu a tempo."
          docker compose logs --tail=100 backend
          exit 1

      - name: Rodar migrações/seed (idempotente)
        run: docker compose exec -T backend node scripts/seed.js

      - name: Limpar imagens antigas não usadas
        run: docker image prune -f
